$("#sv").onclick=async function(){var r=await sb.from("projects").insert({kind:"website",title:String(cfg.handle).slice(0,120),data:cfg});toast(r.error?r.error.message:"Saved to My projects")};
$("#pub").onclick=async function(){var slug=slugify(cfg.handle);if(slug.length<3){toast("Use a handle with at least 3 letters or numbers");return}

async function importIG(){
$("#res").innerHTML='<div class="panel"><b>Bringing in your Instagram…</b><div class="bar"><i style="width:60%"></i></div></div>';
var r=await sb.functions.invoke("instagram-import"),d=r.data;
if(r.error||!d||d.error){$("#res").innerHTML="";igm.textContent=d&&(d.error==="not_connected"||d.error==="expired")?"Please connect your Instagram first.":"We couldn’t load your Instagram. Please try again.";return}
showResult({handle:d.username||"instagram",bio:d.bio||"Welcome to my page",cta:"Follow on Instagram",look:val("look"),platform:"Instagram",source:"instagram",avatar:d.avatar||"",followers:d.followers,count:d.mediaCount,media:d.posts.map(function(p){return{type:"image",url:p.url,link:p.permalink}}),posts:[]})}
igBtn.onclick=async function(){igBtn.disabled=true;igm.textContent="";
var r=await sb.functions.invoke("instagram-connect"),d=r.data;igBtn.disabled=false;
if(r.error||!d){igm.textContent="We couldn’t start the connection. Please try again.";return}
if(d.error==="not_configured"){igm.textContent="Instagram connection isn’t switched on yet. You can build by hand below.";return}
if(d.url)location.href=d.url};

$("#go").onclick=async function(){
var h=$("#handle").value.trim().replace(/^@/,"");if(!h){toast("Type your handle first");$("#handle").focus();return}
var cfg={handle:h,bio:$("#bio").value.trim()||"Welcome to my page",cta:$("#cta").value.trim()||"Contact me",look:val("look"),platform:val("plat"),media:[],posts:[]};
var fl=Array.prototype.slice.call($("#files").files||[]);
if(fl.length>9){toast("Choose up to 9 files");return}
for(var k=0;k<fl.length;k++){if(!/^(image\/(jpeg|png|webp)|video\/mp4)$/.test(fl[k].type)||fl[k].size>15728640){toast(fl[k].name+" isn’t allowed. Use JPG, PNG, WebP or MP4 under 15 MB.");return}}
var lines=$("#posts").value.split("\n").map(function(x){return x.trim()}).filter(Boolean);
if(lines.length>6){toast("Add up to 6 Instagram posts");return}
for(var j=0;j<lines.length;j++){if(!igParse(lines[j])){toast("This isn’t an Instagram post link: "+lines[j].slice(0,60));return}}
cfg.posts=lines.map(function(x){var q=igParse(x);return "https://www.instagram.com/"+q.t+"/"+q.id+"/"});
$("#go").disabled=true;$("#res").innerHTML='<div class="panel"><b>Uploading your files…</b></div>';
for(var n=0;n<fl.length;n++){var ext={"image/jpeg":"jpg","image/png":"png","image/webp":"webp","video/mp4":"mp4"}[fl[n].type],path=S.user.id+"/"+Date.now()+"-"+n+"."+ext;
var up=await sb.storage.from("site-media").upload(path,fl[n],{contentType:fl[n].type,upsert:false});
if(up.error){toast(up.error.message);$("#go").disabled=false;$("#res").innerHTML="";return}
cfg.media.push({type:fl[n].type==="video/mp4"?"video":"image",url:SBPUB+path})}
$("#go").disabled=false;
$("#res").innerHTML='<div class="panel"><b>Building your website…</b><div class="bar"><i id="pb"></i></div></div>';
var w=0,iv=setInterval(function(){w+=14;$("#pb").style.width=Math.min(w,100)+"%";if(w>=100){clearInterval(iv);showResult(cfg)}},180)}};

V.prompts=function(){
return head(T("prompts"))+'<div class="panel">'+step(1,"What do you need?")+chips("kind",["Image","Video"])+
'<div style="height:14px"></div>'+step(2,"Describe your idea in plain words")+'<textarea id="idea" maxlength="1000" placeholder="A woman selling fresh bread at a busy market"></textarea>'+
'<div style="height:14px"></div>'+step(3,"Choose a style")+chips("style",["Realistic photo","Cartoon","Cinematic","Product ad","Anime"])+
'<div style="height:10px"></div><label class="f" for="mood">Mood</label><select id="mood"><option>Warm and happy</option><option>Dramatic</option><option>Calm and clean</option><option>Fun and colorful</option></select>'+
'<div style="height:18px"></div><button class="btn" id="go">Write my prompt</button></div><div id="res"></div>'};
V.prompts.init=function(){
$("#go").onclick=function(){
var i=$("#idea").value.trim();if(!i){toast("Describe your idea first");$("#idea").focus();return}
var k=val("kind"),s=val("style"),m=$("#mood").value.toLowerCase(),t;
if(k==="Image")t=i+". "+s+" style, "+m+" mood, detailed, sharp focus, natural lighting, balanced composition, high resolution, 4:5 ratio.";
else t=i+". "+s+" style, "+m+" mood. Shot with a smooth camera move, slow push-in, natural motion, soft lighting, 24 fps, 10 seconds, 16:9, no text on screen.";
$("#res").innerHTML='<div class="panel"><h2>Your '+k.toLowerCase()+' prompt</h2><div class="out" id="pt">'+esc(t)+'</div><div class="row"><button class="btn" id="cp">Copy prompt</button><button class="btn ghost" id="mk">Make this image</button><button class="btn ghost" id="sv">Save to My projects</button><button class="btn ghost" id="again">Try another version</button></div></div>';
$("#cp").onclick=function(){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){toast("Copied")},function(){toast("Press and hold the text to copy")})};
$("#sv").onclick=async function(){var r=await sb.from("projects").insert({kind:"prompt",title:i.slice(0,120),data:{text:t,type:k}});toast(r.error?r.error.message:"Saved to My projects")};
$("#mk").onclick=function(){S.prefill=i;go("images")};
$("#again").onclick=function(){$("#go").click()}}};

V.images=function(){
return head(T("images"))+'<div class="panel">'+step(1,"Describe the picture")+'<textarea id="ip" maxlength="1000" placeholder="A red sports car parked on a Lagos street at sunset"></textarea>'+
'<div style="height:14px"></div>'+step(2,"Choose a style")+chips("is",["Realistic photo","Cartoon","Cinematic","Product ad","Anime"])+
'<div style="height:14px"></div>'+step(3,"Choose a shape")+chips("ish",["Square","Portrait","Landscape"])+
'<div style="height:18px"></div><button class="btn" id="go">Create image</button><p class="hint" id="im" role="alert" style="color:var(--red);min-height:1.4em"></p><p class="hint">Free plan: 5 images a day. Please don’t create images of real people without their permission.</p></div><div id="res"></div><h2>My images</h2><div class="panel" id="gal"><p class="hint">Loading…</p></div>'};
V.images.init=function(){
var SZ={Square:"1024x1024",Portrait:"1024x1536",Landscape:"1536x1024"};
if(S.prefill){$("#ip").value=S.prefill;S.prefill=""}
async function save(u,name){try{var b=await(await fetch(u)).blob(),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},3000)}catch(e){toast("Couldn’t download. Try again.")}}
async function loadGal(){
var r=await sb.from("generations").select("id,prompt,image_path").order("created_at",{ascending:false}).limit(12);
if(r.error){$("#gal").innerHTML='<p class="hint">Couldn’t load your images. Refresh and try again.</p>';return}
if(!r.data.length){$("#gal").innerHTML='<p>No images yet. Describe one above and press Create image.</p>';return}
var sg=await sb.storage.from("generations").createSignedUrls(r.data.map(function(x){return x.image_path}),3600),urls={};
(sg.data||[]).forEach(function(x){if(x.path&&x.signedUrl)urls[x.path]=x.signedUrl});
$("#gal").innerHTML='<div class="igrid">'+r.data.map(function(x){var u=urls[x.image_path];return u?'<div class="icard"><img src="'+esc(u)+'" alt="'+esc(x.prompt)+'" loading="lazy"><div class="row" style="margin-top:8px"><button class="btn ghost sm" data-dl="'+esc(u)+'">Download</button><button class="btn ghost sm" data-rm="'+esc(x.id)+'" data-p="'+esc(x.image_path)+'">Delete</button></div></div>':""}).join("")+'</div>'}
$("#gal").onclick=async function(e){var d=e.target.closest("[data-dl]"),m=e.target.closest("[data-rm]");
if(d)save(d.getAttribute("data-dl"),"lia-ai-image.png");
if(m){await sb.storage.from("generations").remove([m.getAttribute("data-p")]);var r=await sb.from("generations").delete().eq("id",m.getAttribute("data-rm"));toast(r.error?r.error.message:"Deleted");loadGal()}};
$("#go").onclick=async function(){var p=$("#ip").value.trim(),m=$("#im"),b=$("#go");m.textContent="";
if(p.length<3){m.textContent="Describe your picture first.";return}
b.disabled=true;$("#res").innerHTML='<div class="panel"><b>Creating your image… this can take up to a minute.</b><div class="bar"><i style="width:60%"></i></div></div>';
var r=await sb.functions.invoke("generate-image",{body:{prompt:p,style:val("is"),size:SZ[val("ish")]}}),d=r.data;
b.disabled=false;$("#res").innerHTML="";
if(r.error||!d||d.error){var e=d&&d.error;m.textContent=e==="not_configured"?"Image creation isn’t switched on yet. It needs an image service connected first.":e==="limit"?"You’ve used all your images for today. Upgrade your plan or try again tomorrow.":e==="blocked"?"That description can’t be used. Try wording it differently.":"We couldn’t create the image. Please try again.";return}
toast(d.remaining+" images left today");loadGal()};
loadGal()};

V.voiceover=function(){
return head(T("voiceover"))+'<div class="panel">'+step(1,"Type or paste your script")+'<textarea id="txt">Welcome to my store. Everything is made fresh every morning.</textarea>'+
'<div style="height:14px"></div>'+step(2,"Choose a voice and speed")+'<div class="row"><div><label class="f" for="voice">Voice</label><select id="voice"></select></div><div><label class="f" for="rate">Speed</label><input type="range" id="rate" min="0.6" max="1.5" step="0.1" value="1" style="width:100%;accent-color:#D62828"></div></div>'+
'<div style="height:18px"></div><div class="row"><button class="btn" id="play">▶ Play</button><button class="btn ghost" id="stop">Stop</button></div><p class="hint">This plays with your device’s built-in voices. Studio-quality voices and MP3 download are coming.</p></div>'};
V.voiceover.init=function(){
var ss=window.speechSynthesis,sel=$("#voice");
function load(){if(!ss)return;var vs=ss.getVoices();sel.innerHTML=vs.length?vs.map(function(v,i){return '<option value="'+i+'">'+esc(v.name+" ("+v.lang+")")+'</option>'}).join(""):'<option>Default voice</option>'}
load();if(ss)ss.onvoiceschanged=load;
$("#play").onclick=function(){if(!ss){toast("Your browser can’t play voices");return}
ss.cancel();var u=new SpeechSynthesisUtterance($("#txt").value),vs=ss.getVoices();if(vs[sel.value])u.voice=vs[sel.value];u.rate=+$("#rate").value;ss.speak(u)};
$("#stop").onclick=function(){if(ss)ss.cancel()}};

V.clone=function(){
return head(T("clone"))+'<div class="panel">'+step(1,"Confirm it’s your voice")+'<label class="check"><input type="checkbox" id="ok"><span>This is my own voice, or the owner of the voice gave me clear permission to clone it.</span></label>'+
'<div class="note">We only clone voices with permission. This protects you and the people around you.</div>'+
'<div style="height:6px"></div>'+step(2,"Add a recording")+'<input type="file" id="file" accept="audio/*"><p class="hint">Speak clearly for 30 to 60 seconds, with no background noise.</p>'+
'<div style="height:14px"></div>'+step(3,"Name your voice")+'<input type="text" id="vn" placeholder="My business voice">'+
'<div style="height:18px"></div><button class="btn" id="go" disabled>Create my voice</button></div><div id="res"></div>'};
V.clone.init=function(){
function chk(){$("#go").disabled=!($("#ok").checked&&$("#file").files.length&&$("#vn").value.trim())}
["#ok","#file","#vn"].forEach(function(s){$(s).oninput=chk;$(s).onchange=chk});
$("#go").onclick=function(){$("#res").innerHTML='<div class="panel"><h2>Voice cloning is not switched on yet</h2><p>Nothing was uploaded. This tool needs a voice service connected to your account first, and we’ll show it here as soon as it’s ready.</p></div>'}};

V.pdf=function(){
return head(T("pdf"))+'<div class="panel">'+step(1,"Choose your file")+'<input type="file" id="file"><div style="height:14px"></div>'+step(2,"What should it become?")+chips("to",["Word","Image (JPG)","Text","PDF"])+
'<div style="height:18px"></div><button class="btn" id="go">Convert</button><p class="hint" id="msg"></p></div>'};
V.pdf.init=function(){
$("#go").onclick=function(){if(!$("#file").files[0]){toast("Choose a file first");return}$("#msg").textContent="File conversion is not switched on yet. Your file was not uploaded."}};

V.saver=function(){
return head(T("saver"))+'<div class="panel">'+step(1,"Paste the video link")+'<input type="url" id="url" placeholder="https://">'+
'<div style="height:14px"></div>'+step(2,"Confirm")+'<label class="check"><input type="checkbox" id="ok"><span>I made this video, or the owner said I can save it.</span></label>'+
'<div class="note">Saving other people’s videos can break platform rules and copyright law, so this tool is for your own content.</div>'+
'<button class="btn" id="go" disabled>Get my video</button></div><div id="res"></div>'};
V.saver.init=function(){
function chk(){$("#go").disabled=!($("#ok").checked&&/^https?:\/\/\S+/.test($("#url").value.trim()))}
$("#ok").onchange=chk;$("#url").oninput=chk;
$("#go").onclick=function(){$("#res").innerHTML='<div class="panel"><h2>Not switched on yet</h2><p>Saving your own videos is coming soon.</p></div>'}};

V.mine=function(){return '<h1>My projects</h1><p class="lead">Everything you save and publish shows up here.</p><div class="panel" id="acct"></div><div class="panel" id="list"><p class="hint">Loading…</p></div>'};
V.mine.init=async function(){
var plan=(S.profile&&S.profile.plan)||"free",lim={free:10,pro:200,business:2000}[plan]||10;
$("#acct").innerHTML='<div class="row" style="align-items:center"><div><b>'+esc(S.user.email)+'</b><p class="hint" style="margin:2px 0 0">'+esc(plan.charAt(0).toUpperCase()+plan.slice(1))+' plan · up to '+lim+' saved projects</p></div><div style="flex:0 0 auto;display:flex;gap:8px;flex-wrap:wrap"><button class="btn alt sm" id="up">Upgrade</button><button class="btn ghost sm" id="cp">Change password</button><button class="btn ghost sm" id="so">Sign out</button></div></div>';
$("#up").onclick=function(){toast("Paid plans are coming soon")};
$("#cp").onclick=function(){go("reset")};
$("#so").onclick=async function(){await sb.auth.signOut();S.user=null;S.profile=null;go("auth")};
async function draw(){
var a=await sb.from("projects").select("id,kind,title,created_at").order("created_at",{ascending:false}),b=await sb.from("sites").select("slug,published").eq("user_id",S.user.id).eq("published",true);
if(a.error||b.error){$("#list").innerHTML='<p class="hint">Couldn’t load your projects. Refresh and try again.</p>';return}
var h="";
b.data.forEach(function(s){var u=siteURL(s.slug);h+='<div class="item"><div><b>🌐 Live: '+esc(s.slug)+'</b><a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(u)+'</a></div><button class="btn ghost sm" data-unp="'+esc(s.slug)+'">Take offline</button></div>'});
a.data.forEach(function(p){h+='<div class="item"><div><b>'+({website:"🌐",prompt:"✨",voiceover:"🎙️"}[p.kind]||"")+' '+esc(p.title)+'</b><span class="hint">Saved '+esc(new Date(p.created_at).toLocaleDateString())+'</span></div><button class="btn ghost sm" data-del="'+esc(p.id)+'">Delete</button></div>'});
$("#list").innerHTML=h||'<p>Nothing saved yet. Make a website or write a prompt, then press Save.</p>'}
$("#list").onclick=async function(e){var d=e.target.closest("[data-del]"),u=e.target.closest("[data-unp]");
if(d){var r=await sb.from("projects").delete().eq("id",d.getAttribute("data-del"));toast(r.error?r.error.message:"Deleted");draw()}
if(u){var r2=await sb.from("sites").update({published:false}).eq("slug",u.getAttribute("data-unp"));toast(r2.error?r2.error.message:"Website taken offline");draw()}};
draw()};

function nav(cur){$("#nav").innerHTML='<a href="#home" class="'+(cur==="home"?"on":"")+'"><span class="e">🏠</span>Home</a>'+TOOLS.map(function(t){return '<a href="#'+t.id+'" class="'+(cur===t.id?"on":"")+'"><span class="e">'+t.e+'</span>'+t.n+'</a>'}).join("")+'<a href="#mine" class="'+(cur==="mine"?"on":"")+'"><span class="e">📁</span>My projects</a>'}
async function showSite(slug){
var r=await sb.from("sites").select("config").eq("slug",slug).eq("published",true).maybeSingle();
if(r.error||!r.data){$("#main").innerHTML='<h1>Website not found</h1><p class="lead">This address isn’t live. The owner may have taken it offline.</p>';return}
var c=r.data.config||{};document.title=String(c.handle||"Website").slice(0,60);
$("#main").innerHTML=siteHTML(c,"Made with Lia Ai")}
function route(){
var id=location.hash.slice(1),pub=false;
if(window.speechSynthesis)speechSynthesis.cancel();
if(id.indexOf("s-")===0){$(".app").classList.add("pub");$("#main").innerHTML='<p class="lead">Loading…</p>';showSite(id.slice(2).slice(0,30));return}
if(id==="ig-connected"||id==="ig-error"){if(id==="ig-connected")S.igJust=true;else toast("Instagram wasn’t connected. Please try again.");history.replaceState(null,"","#website");id="website"}
if(!S.user){id="auth";pub=true}else if(S.recovery)id="reset";else if(!V[id]||id==="auth")id="home";
$(".app").classList.toggle("pub",pub);
$("#main").innerHTML=V[id]();nav(id);window.scrollTo(0,0);
if(V[id].init)V[id].init()}
document.addEventListener("click",function(e){var c=e.target.closest(".chip");if(!c)return;
c.parentNode.querySelectorAll(".chip").forEach(function(x){x.setAttribute("aria-pressed",x===c)})});
window.addEventListener("hashchange",route);
(async function(){try{var r=await sb.auth.getSession();S.user=r.data.session?r.data.session.user:null;if(S.user)await loadProfile()}catch(e){}route()})();
</script>
